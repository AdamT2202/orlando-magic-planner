<script>
  fetch('/nav.html')
    .then(r => r.text())
    .then(html => {
      document.getElementById('nav-placeholder').innerHTML = html;

      // Runs after nav is injected into the page
      const burger  = document.getElementById('navBurger');
      const drawer  = document.getElementById('navDrawer');
      const overlay = document.getElementById('navOverlay');

      function openDrawer() {
        overlay.style.display = 'block';
        overlay.offsetHeight; // force reflow so transition fires
        drawer.classList.add('open');
        overlay.classList.add('open');
        burger.classList.add('open');
        burger.setAttribute('aria-expanded', 'true');
        document.body.style.overflow = 'hidden';
      }

      function closeDrawer() {
        drawer.classList.remove('open');
        overlay.classList.remove('open');
        burger.classList.remove('open');
        burger.setAttribute('aria-expanded', 'false');
        document.body.style.overflow = '';
        setTimeout(() => { overlay.style.display = 'none'; }, 300);
      }

      burger.addEventListener('click', () => {
        drawer.classList.contains('open') ? closeDrawer() : openDrawer();
      });

      overlay.addEventListener('click', closeDrawer);

      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') closeDrawer();
      });
    });
</script>

/* Known park keys and display names for grouping */
const parkKeys = {

};

/* Color palette for generic thumbnails (one color per park key) */
const parkColors = {

  "EPCOT": ["#0EA5A4","#06B6D4"],

  "Other": ["#64748B","#94A3B8"]
};

/* Utility: convert slug to Option A title (e.g., "epcot-for-couples-in-spring" -> "EPCOT for Couples in Spring") */
function slugToTitle(slug) {
  slug = slug.replace(/\.html$/, "");
  const parts = slug.split("-");
  const words = parts.map(w => {
    if (w === "epcot") return "EPCOT";
    if (w === "seaworld") return "SeaWorld";
    if (w === "epic") return "Epic";
    if (w === "universal") return "Universal";
    if (w === "studios") return "Studios";
    if (w === "islands") return "Islands";
    if (w === "adventure") return "Adventure";
    if (w === "kingdom") return "Kingdom";
    if (w === "hollywood") return "Hollywood";
    if (w === "magic") return "Magic";
    if (w === "animal") return "Animal";
    if (w === "young") return "Young";
    if (w === "kids") return "Kids";
    if (w === "teens") return "Teens";
    if (w === "solo") return "Solo";
    if (w === "travellers") return "Travellers";
    if (w === "traveller") return "Traveller";
    if (w === "couples") return "Couples";
    if (w === "adults") return "Adults";
    if (w === "in") return "in";
    if (w === "spring") return "Spring";
    if (w === "summer") return "Summer";
    if (w === "autumn") return "Autumn";
    if (w === "winter") return "Winter";
    if (w === "with") return "with";
    if (w === "for") return "for";
    return w.charAt(0).toUpperCase() + w.slice(1);
  });

  for (const key in parkKeys) {
    if (slug.startsWith(key + "-") || slug === key) {
      const parkName = parkKeys[key];
      const keyParts = key.split("-");
      // remove keyParts from start of words if present
      let idx = 0;
      while (idx < keyParts.length && words.length && words[0].toLowerCase() === keyParts[idx]) {
        words.shift();
        idx++;
      }
      const rest = words.map(w => w === "in" ? "in" : w).join(" ");
      return rest ? `${parkName} ${rest}` : parkName;
    }
  }
  return words.join(" ");
}

/* Build guide objects */
const guides = slugs.map(s => {
  return {
    slug: s,
    url: `/resources/${s}.html`,
    title: slugToTitle(s),
    park: detectPark(s)

});

/* Detect park by checking known keys in slug */
function detectPark(slug) {
  for (const key in parkKeys) {
    if (slug.startsWith(key + "-") || slug.includes("-" + key + "-") || slug === key) {
      return parkKeys[key];
    }
  }
  for (const key in parkKeys) {
    if (slug.includes(key)) return parkKeys[key];
  }
  return "Other";
}

/* Group guides by park */
function groupByPark(list) {
  const map = {};
  list.forEach(g => {
    if (!map[g.park]) map[g.park] = [];
    map[g.park].push(g);
  });
  const order = ["Magic Kingdom","EPCOT","Animal Kingdom","Hollywood Studios","Islands of Adventure","Universal Studios","SeaWorld","Epic Universe"];
  const ordered = {};
  order.forEach(k => {
    if (map[k]) ordered[k] = map[k];
  });
  for (const k in map) {
    if (!ordered[k]) ordered[k] = map[k];
  }
  return ordered;
}

  const short = title.split(" ").slice(0,6).join(" ");
  return `
    <svg class="post-thumb" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="g${initials.replace(/\W/g,'')}" x1="0" x2="1" y1="0" y2="1">
          <stop offset="0" stop-color="${bg1}"/>
          <stop offset="1" stop-color="${bg2}"/>
        </linearGradient>
      </defs>
      <rect width="100%" height="100%" fill="url(#g${initials.replace(/\W/g,'')})"/>
      <g fill="rgba(255,255,255,0.12)">
        <circle cx="520" cy="40" r="40"/>
        <circle cx="480" cy="80" r="28"/>
        <circle cx="540" cy="110" r="18"/>
      </g>
      <g transform="translate(24,36)">
        <rect x="0" y="0" width="84" height="84" rx="14" fill="rgba(255,255,255,0.12)"/>
        <text x="42" y="52" font-family="Inter, Arial" font-size="36" fill="#fff" font-weight="700" text-anchor="middle" alignment-baseline="middle">${initials}</text>
      </g>
      <text x="24" y="220" font-family="Inter, Arial" font-size="22" fill="#ffffff" font-weight="700">${escapeXml(short)}</text>
      <text x="24" y="248" font-family="Inter, Arial" font-size="14" fill="rgba(255,255,255,0.9)">${parkName}</text>
    </svg>
  `;
}

/* Escape XML for SVG text nodes */
function escapeXml(unsafe) {
  return unsafe.replace(/[&<>"']/g, function (c) {
    switch (c) {
      case '&': return '&amp;';
      case '<': return '&lt;';
      case '>': return '&gt;';
      case '"': return '&quot;';
      case "'": return '&apos;';
    }
  });
}

/* Create card HTML with SVG thumbnail */
function createCardHtml(guide) {
  const thumbSvg = svgThumb(guide.park, guide.title);
  const category = guide.park;
  return `
    <a class="post-card" href="${guide.url}">
      ${thumbSvg}
      <div class="post-card-content">
        <div class="post-card-cats">${category}</div>
        <h2>${guide.title}</h2>
        <div class="post-card-meta">Guide</div>
      </div>
    </a>
  `;
}

/* Render sections */
function renderSections(filteredGuides) {
  const container = document.getElementById("resourcesSections");
  container.innerHTML = "";
  const grouped = groupByPark(filteredGuides);

  for (const park in grouped) {
    const guidesForPark = grouped[park];
    const section = document.createElement("section");
    section.className = "resources-section";

    const header = document.createElement("div");
    header.className = "section-header";
    header.innerHTML = `<h3>${park} Guides</h3><div class="section-count">${guidesForPark.length} guides</div>`;

    const gridWrap = document.createElement("div");
    gridWrap.className = "section-grid";

    const grid = document.createElement("div");
    grid.className = "posts-grid";
    grid.innerHTML = guidesForPark.map(g => createCardHtml(g)).join("");

    gridWrap.appendChild(grid);
    section.appendChild(header);
    section.appendChild(gridWrap);
    container.appendChild(section);
  }
}

/* Category bar rendering and interactions */
const categoryBar = document.getElementById("categoryBar");
const categories = ["All", ...Object.values(parkKeys)];
function renderCategoryBar() {
  categoryBar.innerHTML = categories.map(cat => {
    const safe = cat.replace(/\s+/g,'-').toLowerCase();
    return `<button class="category-btn" data-cat="${cat}">${cat}</button>`;
  }).join("");
  // set All active by default
  categoryBar.querySelector('[data-cat="All"]').classList.add('active');

  categoryBar.addEventListener('click', (e) => {
    const btn = e.target.closest('.category-btn');
    if (!btn) return;
    const cat = btn.getAttribute('data-cat');
    // toggle active class
    categoryBar.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    // filter and render
    if (cat === "All") {
      renderSections(guides);
    } else {
      const filtered = guides.filter(g => g.park === cat);
      renderSections(filtered);
      // scroll to sections container for better UX
      document.getElementById('resourcesSections').scrollIntoView({behavior:'smooth', block:'start'});
    }
  });
}

/* Search/filter logic */
const searchInput = document.getElementById("searchInput");
function filterGuides(q) {
  if (!q) return guides;
  q = q.trim().toLowerCase();
  return guides.filter(g => {
    return g.title.toLowerCase().includes(q) || g.slug.toLowerCase().includes(q) || g.park.toLowerCase().includes(q);
  });
}

/* Expand / collapse helpers */
document.getElementById("expandAll").addEventListener("click", () => {
  document.querySelectorAll(".posts-grid").forEach(g => g.style.display = "grid");
});
document.getElementById("collapseAll").addEventListener("click", () => {
  document.querySelectorAll(".posts-grid").forEach(g => g.style.display = "none");
});

/* Live search with category awareness */
searchInput.addEventListener("input", (e) => {
  const q = e.target.value;
  const activeBtn = categoryBar.querySelector('.category-btn.active');
  const activeCat = activeBtn ? activeBtn.getAttribute('data-cat') : "All";
  let filtered = filterGuides(q);
  if (activeCat && activeCat !== "All") {
    filtered = filtered.filter(g => g.park === activeCat);
  }
  renderSections(filtered);
});

/* Initial render */
renderCategoryBar();
renderSections(guides);
</script>
